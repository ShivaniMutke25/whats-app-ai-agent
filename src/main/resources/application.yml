spring:
  application:
    name: whatsapp-ai-agent
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  kafka:
    topic:
      inbound: ${KAFKA_INBOUND_TOPIC:whatsapp.inbound}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:whatsapp-ai-group}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      timeout-ms: ${OPENAI_TIMEOUT_MS:15000}
      temperature: ${OPENAI_TEMPERATURE:0.2}
  whatsapp:
    api:
      base-url: ${WHATSAPP_API_BASE_URL:https://graph.facebook.com/v20.0}
      access-token: ${WHATSAPP_ACCESS_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    mock-mode: ${WHATSAPP_MOCK_MODE:true}
