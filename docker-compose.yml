services:
  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: 'true'
      ALLOW_PLAINTEXT_LISTENER: 'yes'
    ports: ["9092:9092"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  gateway-service:
    build: { context: ., dockerfile: gateway-service/Dockerfile }
    environment: { KAFKA_BOOTSTRAP_SERVERS: kafka:9092 }
    depends_on: [kafka]
    ports: ["8081:8081"]
  context-service:
    build: { context: ., dockerfile: context-service/Dockerfile }
    ports: ["8082:8082"]
  outbound-service:
    build: { context: ., dockerfile: outbound-service/Dockerfile }
    environment:
      WHATSAPP_MOCK_MODE: ${WHATSAPP_MOCK_MODE:-true}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
    ports: ["8083:8083"]
  ai-service:
    build: { context: ., dockerfile: ai-service/Dockerfile }
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      CONTEXT_SERVICE_URL: http://context-service:8082
      OUTBOUND_SERVICE_URL: http://outbound-service:8083
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on: [kafka, redis, context-service, outbound-service]
    ports: ["8084:8084"]
